openapi: 3.1.0
info:
  title: Token-Based Peer-To-Peer Learning Platform API
  version: 0.3.0
  description: >-
    API contract for authentication, user profiles, the token wallet, lesson
    listings with price guidance, lesson bookings with token escrow, disputes,
    ratings, booking messages, free content, reports, and administration.
    The token cost of a lesson is always taken from the server-side lesson
    listing, never from the client. Tokens are held when a booking is confirmed,
    released to the educator when the lesson is completed, and refunded when it
    is cancelled or the educator does not attend.
    Three behaviors have no endpoint because no client starts them: lesson
    completion after the dispute deadline (US-12) and monthly content rewards
    (US-19) run as scheduled jobs, and emails (US-16) are sent by the server
    after a booking is confirmed and before the lesson starts. Their results
    are visible through GET /bookings/{bookingId} and GET /wallet/transactions.
  license:
    name: Apache 2.0
    identifier: Apache-2.0
servers:
  - url: /api
    description: Relative to the host where the platform is deployed
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Sign-in through an external OAuth provider
  - name: Wallet
    description: Token balance and ledger
  - name: Lessons
    description: Lesson listings and price guidance
  - name: Bookings
    description: Lesson bookings, escrow, disputes, and ratings
  - name: Users
    description: User profiles with skills, interests, and availability
  - name: Messages
    description: Text messages between the two participants of a booking
  - name: Content
    description: Free short lessons and documents published by educators
  - name: Reports
    description: Reports of inappropriate content or behavior
  - name: Admin
    description: Dispute resolution, reports, and audit logs for administrators

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in with an OAuth provider token
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The provider token is invalid or expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                title: Invalid provider token
                status: 401
                code: INVALID_PROVIDER_TOKEN

  /wallet/balance:
    get:
      tags: [Wallet]
      summary: Get the current token balance
      operationId: getWalletBalance
      responses:
        '200':
          description: Current balance, including tokens held in escrow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalance'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /wallet/transactions:
    get:
      tags: [Wallet]
      summary: List ledger entries of the current user
      operationId: listWalletTransactions
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Ledger entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LedgerEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /lessons:
    get:
      tags: [Lessons]
      summary: Search lesson listings
      operationId: searchLessons
      parameters:
        - in: query
          name: subject
          required: false
          schema: { type: string, example: Linear Algebra }
        - in: query
          name: from
          required: false
          description: Only listings with an available slot at or after this time
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: false
          description: Only listings with an available slot before this time
          schema: { type: string, format: date-time }
        - in: query
          name: maxPrice
          required: false
          schema: { type: integer, minimum: 1 }
        - in: query
          name: minRating
          required: false
          description: Only listings whose educator has at least this average rating
          schema: { type: number, minimum: 0, maximum: 5, example: 4 }
        - in: query
          name: level
          required: false
          schema:
            $ref: '#/components/schemas/LessonLevel'
      responses:
        '200':
          description: >-
            Matching listings with price guidance. Results are ordered by how well
            the educator's skills and weekly availability match the request.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LessonListing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Lessons]
      summary: Create a lesson listing as an educator
      operationId: createLesson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewLessonListing'
      responses:
        '201':
          description: Listing created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonListing'
        '400':
          description: >-
            Invalid input, or the price is outside ±50% of the suggested
            average price for similar lessons
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                title: Price out of range
                status: 400
                code: PRICE_OUT_OF_RANGE
                detail: The price must be between 5 and 15 tokens for this subject.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /lessons/price-suggestion:
    get:
      tags: [Lessons]
      summary: Get the suggested price for a subject and level
      operationId: getPriceSuggestion
      parameters:
        - in: query
          name: subject
          required: true
          schema: { type: string, example: Linear Algebra }
        - in: query
          name: level
          required: true
          schema:
            $ref: '#/components/schemas/LessonLevel'
      responses:
        '200':
          description: Suggested price and allowed range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceSuggestion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /bookings:
    post:
      tags: [Bookings]
      summary: Request a lesson slot
      description: >-
        The token cost is copied from the lesson listing on the server. The
        pupil's balance is checked now and the tokens are held when the
        educator confirms the booking.
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBooking'
      responses:
        '201':
          description: Booking requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            The user cannot book this lesson (own lesson, or the limit of
            repeated lessons with the same educator is reached)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                selfBooking:
                  value:
                    title: Self-booking is not allowed
                    status: 403
                    code: SELF_BOOKING_NOT_ALLOWED
                repeatLimit:
                  value:
                    title: Repeated lesson limit reached
                    status: 403
                    code: REPEAT_LIMIT_REACHED
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The slot is not available or the balance is insufficient
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                slotUnavailable:
                  value:
                    title: Slot unavailable
                    status: 409
                    code: SLOT_UNAVAILABLE
                insufficientTokens:
                  value:
                    title: Insufficient tokens
                    status: 409
                    code: INSUFFICIENT_TOKENS

  /bookings/{bookingId}:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    get:
      tags: [Bookings]
      summary: Get a booking
      operationId: getBooking
      responses:
        '200':
          description: The booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings/{bookingId}/confirm:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [Bookings]
      summary: Confirm a booking as the educator and hold the pupil's tokens
      operationId: confirmBooking
      responses:
        '200':
          description: Booking confirmed; tokens are held in escrow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /bookings/{bookingId}/cancel:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [Bookings]
      summary: Cancel a booking and refund held tokens
      operationId: cancelBooking
      responses:
        '200':
          description: Booking cancelled; held tokens are refunded to the pupil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /bookings/{bookingId}/disputes:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [Bookings]
      summary: Open a dispute within 24 hours after the lesson end time
      description: >-
        Without a dispute, the lesson is completed automatically 24 hours after
        its end time and the held tokens are released to the educator. A dispute
        keeps the tokens held until an administrator resolves it.
      operationId: openDispute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDispute'
      responses:
        '201':
          description: Dispute opened; booking status is DISPUTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The dispute window has closed or a dispute already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                title: Dispute window closed
                status: 409
                code: DISPUTE_WINDOW_CLOSED

  /bookings/{bookingId}/ratings:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    post:
      tags: [Bookings]
      summary: Rate the other participant of a completed lesson
      operationId: rateBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRating'
      responses:
        '201':
          description: Rating saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The lesson is not completed or it was already rated by this user
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notCompleted:
                  value:
                    title: Invalid status transition
                    status: 409
                    code: INVALID_STATUS_TRANSITION
                    detail: Only a completed lesson can be rated.
                alreadyRated:
                  value:
                    title: Already rated
                    status: 409
                    code: ALREADY_RATED

  /bookings/{bookingId}/messages:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    get:
      tags: [Messages]
      summary: List the messages of a booking, oldest first
      description: >-
        Messages are stored with the booking and read when the page is opened or
        refreshed. There is no live delivery. Only the pupil and the educator of
        the booking can read them.
      operationId: listBookingMessages
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Messages of the booking
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Messages]
      summary: Send a message to the other participant of a booking
      operationId: sendBookingMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMessage'
      responses:
        '201':
          description: Message stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me:
    get:
      tags: [Users]
      summary: Get the profile of the current user
      operationId: getMyProfile
      responses:
        '200':
          description: The profile of the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Users]
      summary: Update skills, interests, and availability
      description: >-
        Only the fields that are sent are changed. Skills and availability are
        used to match educators in lesson search.
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid input, or an availability range ends before it starts
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                title: Invalid availability range
                status: 400
                code: INVALID_AVAILABILITY_RANGE
                detail: endTime must be later than startTime.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get the public profile of a user
      operationId: getUserProfile
      responses:
        '200':
          description: Public profile with rating and published content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /contents:
    post:
      tags: [Content]
      summary: Publish a free short lesson or document
      description: >-
        Content is free for all users. Educators earn a capped token reward from
        how many different users open it (US-19); the reward is paid by a
        monthly scheduled job as a CONTENT_REWARD ledger entry.
      operationId: publishContent
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewContent'
      responses:
        '201':
          description: Content published on the educator's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          description: The file type is not supported
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                title: Unsupported file type
                status: 415
                code: UNSUPPORTED_FILE_TYPE
                detail: Allowed types are PDF, PNG, JPEG, and MP4.

  /users/{userId}/contents:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Content]
      summary: List the content published by a user
      operationId: listUserContents
      responses:
        '200':
          description: Published content, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Content'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /contents/{contentId}:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    get:
      tags: [Content]
      summary: Open a content item
      description: >-
        Opening content records one use per user. Only users who completed at
        least one lesson are counted for the educator's content reward.
      operationId: getContent
      responses:
        '200':
          description: The content item with a download link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /reports:
    post:
      tags: [Reports]
      summary: Report inappropriate content, a message, or a user
      operationId: createReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewReport'
      responses:
        '201':
          description: Report stored and visible to administrators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/disputes:
    get:
      tags: [Admin]
      summary: List disputes for review
      operationId: listDisputes
      parameters:
        - in: query
          name: status
          required: false
          schema:
            $ref: '#/components/schemas/DisputeStatus'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Disputes, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dispute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminOnly'

  /admin/disputes/{disputeId}/resolution:
    parameters:
      - $ref: '#/components/parameters/DisputeId'
    post:
      tags: [Admin]
      summary: Resolve a dispute by refunding the pupil or paying the educator
      description: >-
        RESOLVED_REFUND returns the held tokens to the pupil with an
        ESCROW_REFUND entry and the booking becomes CANCELLED. RESOLVED_RELEASE
        pays the educator with an ESCROW_RELEASE entry and the booking becomes
        COMPLETED. NO_SHOW is used when the educator did not attend: the pupil
        is refunded and the booking becomes NO_SHOW. Balances are never edited
        directly, and every resolution is written to the audit log.
      operationId: resolveDispute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeResolution'
      responses:
        '200':
          description: Dispute resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The dispute is already resolved
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                title: Dispute already resolved
                status: 409
                code: DISPUTE_ALREADY_RESOLVED

  /admin/reports:
    get:
      tags: [Admin]
      summary: List reports of inappropriate content or behavior
      operationId: listReports
      parameters:
        - in: query
          name: status
          required: false
          schema:
            $ref: '#/components/schemas/ReportStatus'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Reports, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminOnly'

  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: List audit log entries
      description: Every ledger movement and every administrator action is listed.
      operationId: listAuditLogs
      parameters:
        - in: query
          name: from
          required: false
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: false
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Audit log entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminOnly'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token returned by /auth/login

  parameters:
    BookingId:
      in: path
      name: bookingId
      required: true
      schema: { type: string, example: bkg-9901 }
    UserId:
      in: path
      name: userId
      required: true
      schema: { type: string, example: usr-101 }
    ContentId:
      in: path
      name: contentId
      required: true
      schema: { type: string, example: cnt-41 }
    DisputeId:
      in: path
      name: disputeId
      required: true
      schema: { type: string, example: dsp-77 }
    Limit:
      in: query
      name: limit
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  schemas:
    LoginRequest:
      type: object
      required: [provider, token]
      properties:
        provider:
          type: string
          enum: [google, github]
        token:
          type: string
          description: Access token issued by the OAuth provider
      example:
        provider: github
        token: oauth2_access_token_example

    AuthSession:
      type: object
      required: [accessToken, userId]
      properties:
        accessToken: { type: string }
        userId: { type: string, example: usr-101 }
        role:
          $ref: '#/components/schemas/UserRole'
        isNewUser:
          type: boolean
          description: True on first sign-in, when the welcome balance is credited

    UserRole:
      type: string
      description: Every user can be both pupil and educator; ADMIN is given by the platform team
      enum: [USER, ADMIN]

    AvailabilitySlot:
      type: object
      description: A weekly time range in which the user can teach or learn
      required: [dayOfWeek, startTime, endTime]
      properties:
        dayOfWeek:
          type: string
          enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
        startTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '18:00'
        endTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Must be later than startTime
          example: '20:00'

    ProfileUpdate:
      type: object
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80, example: Ayşe K. }
        bio: { type: string, maxLength: 500 }
        skills:
          type: array
          description: Subjects the user can teach
          items: { type: string, example: Linear Algebra }
        interests:
          type: array
          description: Subjects the user wants to learn
          items: { type: string, example: Spanish }
        availability:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilitySlot'

    PublicProfile:
      type: object
      required: [userId, displayName, ratingAverage, ratingCount]
      properties:
        userId: { type: string, example: usr-101 }
        displayName: { type: string, example: Ayşe K. }
        bio: { type: string }
        skills:
          type: array
          items: { type: string }
        availability:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilitySlot'
        ratingAverage: { type: number, minimum: 0, maximum: 5, example: 4.6 }
        ratingCount: { type: integer, minimum: 0, example: 12 }

    UserProfile:
      description: The profile of the signed-in user; email is visible only to its owner
      allOf:
        - $ref: '#/components/schemas/PublicProfile'
        - type: object
          required: [email, role]
          properties:
            email: { type: string, format: email }
            role:
              $ref: '#/components/schemas/UserRole'
            interests:
              type: array
              items: { type: string }

    WalletBalance:
      type: object
      required: [userId, tokenBalance, heldTokens]
      properties:
        userId: { type: string, example: usr-101 }
        tokenBalance:
          type: integer
          minimum: 0
          description: Tokens available to spend
          example: 40
        heldTokens:
          type: integer
          minimum: 0
          description: Tokens held in escrow for confirmed bookings
          example: 10

    LedgerEntry:
      type: object
      required: [id, type, amount, createdAt]
      properties:
        id: { type: string, example: txn-5501 }
        type:
          type: string
          enum: [WELCOME_GRANT, ESCROW_HOLD, ESCROW_RELEASE, ESCROW_REFUND, CONTENT_REWARD, ADMIN_CORRECTION]
        amount:
          type: integer
          description: Positive for credits, negative for debits
          example: -10
        bookingId: { type: [string, 'null'], example: bkg-9901 }
        createdAt: { type: string, format: date-time }

    LessonLevel:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED]

    PriceIndicator:
      type: string
      enum: [BELOW_AVERAGE, AROUND_AVERAGE, ABOVE_AVERAGE]

    NewLessonListing:
      type: object
      required: [subject, level, durationMinutes, price]
      properties:
        subject: { type: string, example: Linear Algebra }
        level:
          $ref: '#/components/schemas/LessonLevel'
        durationMinutes: { type: integer, minimum: 15, maximum: 180, example: 60 }
        price:
          type: integer
          minimum: 1
          description: Token price set by the educator, within ±50% of the suggested price
          example: 12
        description: { type: string }

    LessonListing:
      allOf:
        - $ref: '#/components/schemas/NewLessonListing'
        - type: object
          required: [id, educatorId, suggestedPrice, priceIndicator]
          properties:
            id: { type: string, example: lsn-301 }
            educatorId: { type: string, example: edu-202 }
            educatorRating: { type: number, minimum: 0, maximum: 5, example: 4.6 }
            suggestedPrice: { type: integer, example: 10 }
            priceIndicator:
              $ref: '#/components/schemas/PriceIndicator'

    PriceSuggestion:
      type: object
      required: [subject, level, suggestedPrice, minPrice, maxPrice]
      properties:
        subject: { type: string, example: Linear Algebra }
        level:
          $ref: '#/components/schemas/LessonLevel'
        suggestedPrice: { type: integer, example: 10 }
        minPrice: { type: integer, example: 5 }
        maxPrice: { type: integer, example: 15 }

    NewBooking:
      type: object
      required: [lessonId, startsAt]
      properties:
        lessonId: { type: string, example: lsn-301 }
        startsAt: { type: string, format: date-time, example: '2026-11-10T10:00:00Z' }

    BookingStatus:
      type: string
      enum: [PENDING, CONFIRMED, COMPLETED, CANCELLED, NO_SHOW, DISPUTED]

    Booking:
      type: object
      required: [id, lessonId, pupilId, educatorId, startsAt, endsAt, tokenCost, status]
      properties:
        id: { type: string, example: bkg-9901 }
        lessonId: { type: string, example: lsn-301 }
        pupilId: { type: string, example: usr-101 }
        educatorId: { type: string, example: edu-202 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        tokenCost:
          type: integer
          description: Copied from the lesson listing by the server; read-only
          readOnly: true
          example: 12
        status:
          $ref: '#/components/schemas/BookingStatus'
        meetingLink:
          type: [string, 'null']
          format: uri
          description: Shared only with the booked participants after confirmation
        disputeDeadline:
          type: [string, 'null']
          format: date-time
          description: 24 hours after endsAt; after this time the lesson is completed automatically

    NewDispute:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [EDUCATOR_ABSENT, LESSON_NOT_DELIVERED, OTHER]
        details: { type: string }

    Dispute:
      type: object
      required: [id, bookingId, reason, status, createdAt]
      properties:
        id: { type: string, example: dsp-77 }
        bookingId: { type: string, example: bkg-9901 }
        reason:
          type: string
          enum: [EDUCATOR_ABSENT, LESSON_NOT_DELIVERED, OTHER]
        status:
          $ref: '#/components/schemas/DisputeStatus'
        details: { type: string }
        resolution:
          oneOf:
            - $ref: '#/components/schemas/DisputeResolution'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }

    DisputeStatus:
      type: string
      enum: [OPEN, RESOLVED_REFUND, RESOLVED_RELEASE]

    DisputeResolution:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          description: >-
            RESOLVED_REFUND and NO_SHOW refund the pupil (dispute status
            RESOLVED_REFUND); RESOLVED_RELEASE pays the educator.
          enum: [RESOLVED_REFUND, RESOLVED_RELEASE, NO_SHOW]
        note:
          type: string
          description: Reason for the decision, stored in the audit log
          maxLength: 1000

    NewMessage:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }

    Message:
      allOf:
        - $ref: '#/components/schemas/NewMessage'
        - type: object
          required: [id, bookingId, senderId, createdAt]
          properties:
            id: { type: string, example: msg-310 }
            bookingId: { type: string, example: bkg-9901 }
            senderId: { type: string, example: usr-101 }
            createdAt: { type: string, format: date-time }

    NewContent:
      type: object
      required: [title, file]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        file:
          type: string
          contentMediaType: application/octet-stream
          description: PDF, PNG, JPEG, or MP4 file, at most 50 MB

    Content:
      type: object
      required: [id, educatorId, title, fileType, createdAt]
      properties:
        id: { type: string, example: cnt-41 }
        educatorId: { type: string, example: edu-202 }
        title: { type: string, example: Eigenvalues in 10 minutes }
        description: { type: string }
        fileType:
          type: string
          enum: [PDF, PNG, JPEG, MP4]
        downloadUrl: { type: string, format: uri }
        uniqueUsers:
          type: integer
          minimum: 0
          description: Different users who opened the content
        createdAt: { type: string, format: date-time }

    ReportStatus:
      type: string
      enum: [OPEN, REVIEWED, DISMISSED]

    NewReport:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType:
          type: string
          enum: [CONTENT, MESSAGE, USER]
        targetId: { type: string, example: cnt-41 }
        reason:
          type: string
          enum: [SPAM, HARASSMENT, INAPPROPRIATE_CONTENT, FRAUD, OTHER]
        details: { type: string, maxLength: 1000 }

    Report:
      allOf:
        - $ref: '#/components/schemas/NewReport'
        - type: object
          required: [id, reporterId, status, createdAt]
          properties:
            id: { type: string, example: rpt-8 }
            reporterId: { type: string, example: usr-101 }
            status:
              $ref: '#/components/schemas/ReportStatus'
            createdAt: { type: string, format: date-time }

    AuditLogEntry:
      type: object
      required: [id, action, actorType, createdAt]
      properties:
        id: { type: string, example: aud-1201 }
        action:
          type: string
          description: Ledger entry type or administrator action
          example: DISPUTE_RESOLVED
        actorType:
          type: string
          enum: [USER, ADMIN, SYSTEM]
        actorId: { type: [string, 'null'], example: usr-900 }
        targetType: { type: string, example: BOOKING }
        targetId: { type: string, example: bkg-9901 }
        details: { type: string }
        createdAt: { type: string, format: date-time }

    NewRating:
      type: object
      required: [score]
      properties:
        score: { type: integer, minimum: 1, maximum: 5, example: 5 }
        comment: { type: string }

    Rating:
      allOf:
        - $ref: '#/components/schemas/NewRating'
        - type: object
          required: [id, bookingId, raterId, rateeId]
          properties:
            id: { type: string, example: rtg-12 }
            bookingId: { type: string, example: bkg-9901 }
            raterId: { type: string, example: usr-101 }
            rateeId: { type: string, example: edu-202 }

    Problem:
      type: object
      required: [title, status, code]
      properties:
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          example: INSUFFICIENT_TOKENS
        detail: { type: string }

  responses:
    BadRequest:
      description: Invalid input parameters
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Invalid request
            status: 400
            code: VALIDATION_ERROR
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Unauthorized
            status: 401
            code: UNAUTHORIZED
    Forbidden:
      description: The user is not a participant of this booking or lacks permission
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Forbidden
            status: 403
            code: FORBIDDEN
    AdminOnly:
      description: The operation requires the ADMIN role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Forbidden
            status: 403
            code: ADMIN_ROLE_REQUIRED
    NotFound:
      description: The resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Not found
            status: 404
            code: NOT_FOUND
    Conflict:
      description: The booking is not in a status that allows this action
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            title: Invalid status transition
            status: 409
            code: INVALID_STATUS_TRANSITION
